[pytest]
# Pytest configuration for SeleniumBase tests

# HTML Report Settings
# Use --html=report.html to generate HTML report
# Use --self-contained-html for self-contained report

# Test Discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output Settings
addopts = -v --strict-markers
console_output_style = classic

# Markers
markers =
    skip: Skip test
    slow: Mark test as slow
